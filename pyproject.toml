[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-hailo-mlops"
version = "1.0.0"
description = "Reproducible YOLO11 -> ONNX -> Hailo-8L HEF compiler and MLOps evaluation pipeline for Raspberry Pi 5"
readme = "README.md"
authors = [
    { name = "Mosudi I. O.", email = "imosudi@gmail.com" }
]
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "pyyaml>=6.0.1",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
training = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.3.0",
]
onnx = [
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "onnxsim>=0.4.33",
]
hailo = [
    "hailo-platform>=4.18.0",
    "hailo-sdk-client>=3.28.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]
all = [
    "yolo-hailo-mlops[training,onnx,hailo,dev]",
]

[project.scripts]
train_and_compile = "yolo_hailo_mlops.cli:main"
yolo-hailo-compiler = "yolo_hailo_mlops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "hailo: Tests requiring physical Hailo-8L accelerator hardware.",
    "integration: Integration tests exercising end-to-end multi-phase orchestration.",
    "unit: Isolated unit tests.",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
