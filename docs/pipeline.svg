<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">YOLO11 to Hailo-8L compilation lifecycle</title><desc id="desc">Ordered workflow from dataset validation and training to ONNX export, calibration, Hailo compilation, evaluation, physical-device validation and provenance reporting.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#10283a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#6e91ad"/></marker></defs>
  <rect width="1400" height="760" rx="22" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="60" y="65" fill="#f8fafc" font-size="31" font-weight="700">Reproducible compilation lifecycle</text><text x="60" y="97" fill="#9fb5ca" font-size="16">Portable model workflow → Hailo compiler → target-device validation</text></g>
  <g fill="none" stroke="#6e91ad" stroke-width="3" marker-end="url(#arrow)"><path d="M310 190h70"/><path d="M630 190h70"/><path d="M950 190h70"/><path d="M1165 235v55H185v35"/><path d="M310 365h70"/><path d="M630 365h70"/><path d="M950 365h70"/><path d="M1165 410v55H185v35"/><path d="M310 540h70"/><path d="M630 540h70"/><path d="M950 540h70"/></g>
  <g stroke-width="2"><g fill="#123641" stroke="#2dd4bf"><rect x="60" y="145" width="250" height="90" rx="15"/><rect x="380" y="145" width="250" height="90" rx="15"/><rect x="700" y="145" width="250" height="90" rx="15"/><rect x="1020" y="145" width="290" height="90" rx="15"/></g><g fill="#172e49" stroke="#60a5fa"><rect x="60" y="320" width="250" height="90" rx="15"/><rect x="380" y="320" width="250" height="90" rx="15"/><rect x="700" y="320" width="250" height="90" rx="15"/><rect x="1020" y="320" width="290" height="90" rx="15"/></g><g fill="#153a3c" stroke="#2dd4bf"><rect x="60" y="495" width="250" height="90" rx="15"/><rect x="380" y="495" width="250" height="90" rx="15"/><rect x="700" y="495" width="250" height="90" rx="15"/><rect x="1020" y="495" width="290" height="90" rx="15"/></g></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g fill="#99f6e4"><g font-size="19" font-weight="700"><text x="185" y="179">1 · Dataset</text><text x="505" y="179">2 · Train</text><text x="825" y="179">3 · Export</text><text x="1165" y="179">4 · Validate ONNX</text></g><g font-size="15"><text x="185" y="207">Paths, labels and splits</text><text x="505" y="207">Select best checkpoint</text><text x="825" y="207">FP32 ONNX model</text><text x="1165" y="207">Graph and parity checks</text></g></g><g fill="#bfdbfe"><g font-size="19" font-weight="700"><text x="185" y="354">5 · Calibrate</text><text x="505" y="354">6 · Parse</text><text x="825" y="354">7 · Optimise</text><text x="1165" y="354">8 · Compile</text></g><g font-size="15"><text x="185" y="382">Representative RGB samples</text><text x="505" y="382">ONNX → HAR</text><text x="825" y="382">INT8 quantisation</text><text x="1165" y="382">HAR → Hailo-8L HEF</text></g></g><g fill="#99f6e4"><g font-size="19" font-weight="700"><text x="185" y="529">9 · Evaluate</text><text x="505" y="529">10 · Device test</text><text x="825" y="529">11 · Quality gates</text><text x="1165" y="529">12 · Provenance</text></g><g font-size="15"><text x="185" y="557">Accuracy / task metrics</text><text x="505" y="557">Physical Hailo hardware</text><text x="825" y="557">Latency and acceptance</text><text x="1165" y="557">Hashes and run report</text></g></g></g>
  <rect x="60" y="640" width="1280" height="54" rx="12" fill="#0c1b2b" stroke="#324a60"/><text x="700" y="673" fill="#b8c9d9" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">No silent fallback · explicit execution boundaries · report measured, derived, configured and unavailable values distinctly</text>
