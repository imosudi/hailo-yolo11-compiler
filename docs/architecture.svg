<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Hailo YOLO11 compiler architecture</title><desc id="desc">Three execution domains: portable model preparation, Hailo Dataflow Compiler build stages, and Raspberry Pi hardware inference and telemetry.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif"><text x="55" y="60" fill="#0f172a" font-size="30" font-weight="700">Execution boundaries</text><text x="55" y="89" fill="#475569" font-size="16">Separate model preparation, proprietary compilation and physical deployment responsibilities.</text>
    <g stroke-width="2"><rect x="45" y="125" width="350" height="420" rx="18" fill="#e0f2fe" stroke="#0284c7"/><rect x="425" y="125" width="350" height="420" rx="18" fill="#ede9fe" stroke="#7c3aed"/><rect x="805" y="125" width="350" height="420" rx="18" fill="#dcfce7" stroke="#16a34a"/></g>
    <g font-size="20" font-weight="700"><text x="70" y="165" fill="#075985">Portable host workflow</text><text x="450" y="165" fill="#5b21b6">Hailo compiler boundary</text><text x="830" y="165" fill="#166534">Physical edge target</text></g>
    <g fill="#fff" stroke-width="1"><g stroke="#7dd3fc"><rect x="70" y="190" width="300" height="52" rx="10"/><rect x="70" y="255" width="300" height="52" rx="10"/><rect x="70" y="320" width="300" height="52" rx="10"/><rect x="70" y="385" width="300" height="52" rx="10"/><rect x="70" y="450" width="300" height="52" rx="10"/></g><g stroke="#c4b5fd"><rect x="450" y="205" width="300" height="64" rx="10"/><rect x="450" y="292" width="300" height="64" rx="10"/><rect x="450" y="379" width="300" height="64" rx="10"/></g><g stroke="#86efac"><rect x="830" y="205" width="300" height="64" rx="10"/><rect x="830" y="292" width="300" height="64" rx="10"/><rect x="830" y="379" width="300" height="64" rx="10"/></g></g>
    <g text-anchor="middle"><g fill="#0c4a6e" font-size="16"><text x="220" y="222">Dataset checks and training</text><text x="220" y="287">ONNX export and parity</text><text x="220" y="352">Calibration preparation</text><text x="220" y="417">Evaluation and quality gates</text><text x="220" y="482">Reports and SHA-256 hashes</text></g><g fill="#4c1d95"><text x="600" y="232" font-size="16">DFC parser</text><text x="600" y="253" font-size="14">ONNX → HAR</text><text x="600" y="319" font-size="16">DFC optimiser</text><text x="600" y="340" font-size="14">INT8 post-training quantisation</text><text x="600" y="406" font-size="16">DFC compiler</text><text x="600" y="427" font-size="14">HAR → HEF · hailo8l</text></g><g fill="#14532d"><text x="980" y="232" font-size="16">Raspberry Pi 5</text><text x="980" y="253" font-size="14">Linux and HailoRT</text><text x="980" y="319" font-size="16">Hailo-8L AI HAT+</text><text x="980" y="340" font-size="14">Physical NPU inference</text><text x="980" y="406" font-size="16">Runtime telemetry</text><text x="980" y="427" font-size="14">Latency, FPS and thermals</text></g></g>
    <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"><path d="M395 310h25"/><path d="M775 310h25"/></g><text x="600" y="585" fill="#475569" font-size="15" text-anchor="middle">Compiler availability does not imply hardware availability; device tests require the physical target.</text>
  </g>
</svg>
